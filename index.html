<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c56"><title>Dakdoorvoer Planner</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#172b3a}header{background:#123c56;color:white;padding:20px 16px}h1{font-size:23px;margin:0}header small{opacity:.8}main{max-width:700px;margin:auto;padding:14px 14px 90px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.panel{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}button{border:0;background:#dce6ed;padding:11px 13px;border-radius:9px;font-weight:650;color:#17354b;cursor:pointer}.primary{background:#1675aa;color:white}.danger{background:#ffebeb;color:#a11}.active{background:#123c56;color:white}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;font-size:16px;border:1px solid #cbd5e1;border-radius:9px;background:white}textarea{min-height:65px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row .grow{flex:1}.item{border-bottom:1px solid #e5e7eb;padding:12px 0}.item:last-child{border:0}.muted{color:#667788;font-size:13px}.pill{display:inline-block;padding:3px 8px;background:#e8f3f8;border-radius:30px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.qty{max-width:80px}.hidden{display:none}.right{margin-left:auto}.total{font-weight:750;font-size:20px}.hint{font-size:12px;color:#667788}.nav{display:flex;gap:6px;align-items:center;justify-content:space-between}.nav input{max-width:170px}.check{width:20px;height:20px}a{color:#12669b}#notice{font-size:13px;color:#52687a}</style></head><body><header><h1>🔧 Dakdoorvoer Planner</h1><small>Klanten · planning · materiaallijsten</small></header><main><div class="tabs"><button id="tabPlan" class="active" onclick="tab('plan')">Planning</button><button id="tabNew" onclick="newJob()">+ Opdracht</button><button id="tabList" onclick="tab('list')">Materiaal</button></div><section id="plan"><div class="panel"><div class="nav"><button onclick="shift(-1)">‹</button><input type="date" id="day" onchange="render()"><button onclick="shift(1)">›</button><button onclick="today()">Vandaag</button></div></div><div id="jobs"></div></section><section id="edit" class="hidden"><div class="panel"><h2 id="formTitle">Nieuwe opdracht</h2><form id="form"><input type="hidden" id="jobId"><label>Klantnaam *</label><input id="name" required autocomplete="name"><label>Adres *</label><input id="address" required autocomplete="street-address"><label>Telefoon (optioneel)</label><input id="phone" type="tel"><div class="row"><div class="grow"><label>Werkdatum *</label><input type="date" id="date" required></div><div class="grow"><label>Tijd (optioneel)</label><input type="time" id="time"></div></div><label>Werkzaamheden / opmerkingen</label><textarea id="notes" placeholder="Bijvoorbeeld: oude kap verwijderen, pannentype, dakhelling..."></textarea><h3>Benodigde doorvoeren</h3><div id="lines"></div><button type="button" onclick="addLine()">+ Doorvoer toevoegen</button><div class="actions"><button type="submit" class="primary">Opdracht opslaan</button><button type="button" onclick="tab('plan')">Annuleren</button></div></form></div></section><section id="list" class="hidden"><div class="panel"><h2>Materiaallijst</h2><label>Voor werkdatum</label><input type="date" id="listDay" onchange="renderList()"><div id="materials"></div><div class="actions"><button class="primary" onclick="copyList()">Kopieer lijst</button><button onclick="printList()">Print / deel als PDF</button></div></div><div class="panel"><h3>Back-up</h3><p class="muted">De gegevens staan alleen in deze browser. Maak regelmatig een back-up, vooral vóór het wissen van browsergegevens of het wisselen van telefoon.</p><div class="actions"><button onclick="backup()">Exporteer back-up</button><button onclick="document.getElementById('restore').click()">Importeer back-up</button><input type="file" id="restore" accept="application/json,.json" hidden onchange="restoreFile(event)"></div></div></section><p id="notice"></p></main><script>
const KEY='dakdoorvoer_planner_v1';const TYPES=['Ubbink Ventub 125 – ventilatie','Ubbink Ventub 110 – rioolontluchting','Ontluchtingspan','Ventilatiepan universeel','WTW dakdoorvoer 160','Warmtepomp inlaat','Warmtepomp uitblaas','Anders'];let data=[];try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))data=a}catch(e){alert('Opgeslagen gegevens konden niet worden geladen.')}const $=id=>document.getElementById(id);const localDate=d=>{let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};const now=()=>localDate(new Date());$('day').value=now();$('listDay').value=now();function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Opslaan mislukt. Controleer de opslagruimte van je browser.');return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tab(t){['plan','edit','list'].forEach(x=>$(x).classList.toggle('hidden',x!==t));$('tabPlan').classList.toggle('active',t==='plan');$('tabNew').classList.toggle('active',t==='edit');$('tabList').classList.toggle('active',t==='list');if(t==='plan')render();if(t==='list'){ $('listDay').value=$('day').value;renderList() }scrollTo(0,0)}function today(){$('day').value=now();render()}function shift(n){let d=new Date($('day').value+'T12:00:00');d.setDate(d.getDate()+n);$('day').value=localDate(d);render()}function newJob(){ $('form').reset();$('jobId').value='';$('date').value=$('day').value;$('formTitle').textContent='Nieuwe opdracht';$('lines').innerHTML='';addLine();tab('edit')}function addLine(type='',qty=1){let el=document.createElement('div');el.className='row item';let options=TYPES.map(t=>`<option value="${esc(t)}" ${t===type?'selected':''}>${esc(t)}</option>`).join('');if(type&&!TYPES.includes(type))options+=`<option selected value="${esc(type)}">${esc(type)}</option>`;el.innerHTML=`<select class="grow type" aria-label="Doorvoertype">${options}</select><input class="qty" aria-label="Aantal" type="number" min="1" max="999" step="1" value="${Number(qty)||1}"><button type="button" aria-label="Verwijder regel" onclick="this.parentElement.remove()">×</button>`;$('lines').appendChild(el)}$('form').onsubmit=e=>{e.preventDefault();let lines=[...document.querySelectorAll('#lines .item')].map(x=>({type:x.querySelector('.type').value,qty:Number(x.querySelector('.qty').value)}));if(!lines.length||lines.some(x=>!Number.isInteger(x.qty)||x.qty<1)){alert('Voeg minimaal één doorvoer toe met een geldig aantal.');return}let id=$('jobId').value||String(Date.now())+'_'+Math.random().toString(36).slice(2);let job={id,name:$('name').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim(),date:$('date').value,time:$('time').value,notes:$('notes').value.trim(),lines};if(!job.name||!job.address||!job.date)return;let i=data.findIndex(x=>x.id===id);if(i<0)data.push(job);else data[i]=job;if(save()){$('day').value=job.date;tab('plan')}};function editJob(id){let j=data.find(x=>x.id===id);if(!j)return;newJob();$('jobId').value=j.id;$('formTitle').textContent='Opdracht aanpassen';['name','address','phone','date','time','notes'].forEach(k=>$(k).value=j[k]||'');$('lines').innerHTML='';j.lines.forEach(l=>addLine(l.type,l.qty))}function removeJob(id){if(confirm('Deze opdracht definitief verwijderen?')){data=data.filter(j=>j.id!==id);save();render()}}function render(){let arr=data.filter(j=>j.date===$('day').value).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('jobs').innerHTML=arr.length?arr.map(j=>`<div class="panel"><div class="row"><strong class="grow">${esc(j.name)}</strong><span class="pill">${esc(j.time||'Tijd onbekend')}</span></div><div class="muted">📍 ${esc(j.address)}</div>${j.phone?`<div class="muted">☎ ${esc(j.phone)}</div>`:''}<p>${j.lines.map(l=>`${l.qty}× ${esc(l.type)}`).join('<br>')}</p>${j.notes?`<p class="muted">${esc(j.notes)}</p>`:''}<div class="actions"><button onclick="editJob(${JSON.stringify(j.id)})">Bewerken</button><button onclick="navigate(${JSON.stringify(j.address)})">Navigeren</button>${j.phone?`<button onclick="callPhone(${JSON.stringify(j.phone)})">Bellen</button>`:''}<button class="danger" onclick="removeJob(${JSON.stringify(j.id)})">Verwijderen</button></div></div>`).join(''):'<div class="panel muted">Geen opdrachten op deze datum. Tik op + Opdracht om er een toe te voegen.</div>';$('notice').textContent=`${arr.length} opdracht(en) op ${$('day').value}. ${data.length} totaal opgeslagen.`}function navigate(address){location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address)}function callPhone(phone){location.href='tel:'+phone.replace(/[^\d+]/g,'')}function listText(){let d=$('listDay').value;let jobs=data.filter(j=>j.date===d);let sums=new Map();jobs.forEach(j=>j.lines.forEach(l=>sums.set(l.type,(sums.get(l.type)||0)+Number(l.qty))));let lines=[`Materiaallijst ${d}`,`${jobs.length} opdracht(en)`,''];for(let [t,n] of sums)lines.push(`${n}× ${t}`);if(!sums.size)lines.push('Geen materialen gepland');return lines.join('\n')}function renderList(){let d=$('listDay').value,jobs=data.filter(j=>j.date===d),sums=new Map();jobs.forEach(j=>j.lines.forEach(l=>sums.set(l.type,(sums.get(l.type)||0)+Number(l.qty))));$('materials').innerHTML=[...sums].map(([t,n])=>`<div class="item row"><input type="checkbox" class="check" aria-label="Ingepakt ${esc(t)}"><span class="grow">${esc(t)}</span><strong>${n} st.</strong></div>`).join('')||'<p class="muted">Geen materialen voor deze datum.</p>';$('materials').innerHTML+=`<p class="total">Totaal: ${[...sums.values()].reduce((a,b)=>a+b,0)} doorvoeren</p><p class="muted">Gebaseerd op ${jobs.length} opdracht(en).</p>`}async function copyList(){let s=listText();try{await navigator.clipboard.writeText(s);alert('Materiaallijst gekopieerd.')}catch(e){prompt('Kopieer de lijst:',s)}}function printList(){let s=listText();let w=window.open('','_blank');if(!w){alert('Pop-up geblokkeerd. Gebruik Kopieer lijst.');return}w.document.write('<meta charset="utf-8"><title>Materiaallijst</title><pre style="font:18px system-ui;white-space:pre-wrap">'+esc(s)+'</pre>');w.document.close();w.focus();w.print()}function backup(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),jobs:data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dakdoorvoer-backup-'+now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restoreFile(e){let file=e.target.files[0];if(!file)return;try{let v=JSON.parse(await file.text());if(!Array.isArray(v.jobs)||!v.jobs.every(j=>typeof j.id==='string'&&typeof j.name==='string'&&typeof j.address==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(j.date)&&Array.isArray(j.lines)&&j.lines.every(l=>typeof l.type==='string'&&Number.isInteger(l.qty)&&l.qty>0)))throw Error('Ongeldig bestand');if(!confirm('Dit vervangt alle huidige opdrachten door '+v.jobs.length+' opdrachten uit de back-up. Doorgaan?'))return;data=v.jobs;if(save()){render();alert('Back-up hersteld.')}}catch(err){alert('Importeren mislukt: '+err.message)}finally{e.target.value=''}}render();</script></body></html>
