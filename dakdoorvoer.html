<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c56"><title>Dakdoorvoer Planner</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#172b3a}header{background:#123c56;color:white;padding:20px 16px}h1{font-size:23px;margin:0}header small{opacity:.8}main{max-width:700px;margin:auto;padding:14px 14px 90px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.panel{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}button{border:0;background:#dce6ed;padding:11px 13px;border-radius:9px;font-weight:650;color:#17354b;cursor:pointer}.primary{background:#1675aa;color:white}.danger{background:#ffebeb;color:#a11}.active{background:#123c56;color:white}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;font-size:16px;border:1px solid #cbd5e1;border-radius:9px;background:white}textarea{min-height:65px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row .grow{flex:1}.item{border-bottom:1px solid #e5e7eb;padding:12px 0}.item:last-child{border:0}.muted{color:#667788;font-size:13px}.pill{display:inline-block;padding:3px 8px;background:#e8f3f8;border-radius:30px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.qty{max-width:80px}.hidden{display:none!important}.total{font-weight:750;font-size:20px}.nav{display:flex;gap:6px;align-items:center;justify-content:space-between}.nav input{max-width:170px}.check{width:20px;height:20px}#notice{font-size:13px;color:#52687a}</style></head><body><header><a href="index.html" style="color:white;display:inline-block;margin-bottom:9px;text-decoration:none;font-weight:700">‹ Startpagina</a><h1>🔧 Dakdoorvoer Planner</h1><small>Klanten · planning · materiaallijsten</small></header><main><div class="tabs"><button id="tabPlan" class="active" type="button">Planning</button><button id="tabNew" type="button">+ Opdracht</button><button id="tabList" type="button">Materiaal</button></div><section id="plan"><div class="panel"><div class="nav"><button id="prev" type="button">‹</button><input type="date" id="day"><button id="next" type="button">›</button><button id="today" type="button">Vandaag</button></div></div><div id="jobs"></div></section><section id="edit" class="hidden"><div class="panel"><h2 id="formTitle">Nieuwe opdracht</h2><form id="form"><input type="hidden" id="jobId"><label for="name">Klantnaam *</label><input id="name" required><label for="address">Adres *</label><input id="address" required><label for="phone">Telefoon</label><input id="phone" type="tel"><div class="row"><div class="grow"><label for="date">Werkdatum *</label><input type="date" id="date" required></div><div class="grow"><label for="time">Tijd</label><input type="time" id="time"></div></div><label for="notes">Werkzaamheden / opmerkingen</label><textarea id="notes"></textarea><h3>Benodigde doorvoeren</h3><div id="lines"></div><button type="button" id="addLine">+ Doorvoer toevoegen</button><div class="actions"><button type="submit" class="primary">Opdracht opslaan</button><button type="button" id="cancel">Annuleren</button></div></form></div></section><section id="list" class="hidden"><div class="panel"><h2>Materiaallijst</h2><label for="listDay">Voor werkdatum</label><input type="date" id="listDay"><div id="materials"></div><div class="actions"><button class="primary" id="copy">Kopieer lijst</button><button id="print">Print / deel als PDF</button></div></div><div class="panel"><h3>Back-up</h3><p class="muted">De gegevens staan alleen in deze browser. Maak regelmatig een back-up, vooral vóór het wissen van browsergegevens of het wisselen van telefoon.</p><div class="actions"><button id="backup">Exporteer back-up</button><button id="import">Importeer back-up</button><input type="file" id="restore" accept="application/json,.json" hidden></div></div></section><p id="notice"></p></main><script>
'use strict';
const KEY='dakdoorvoer_planner_v1';
const TYPES=['Ubbink Ventub 125 – ventilatie','Ubbink Ventub 110 – rioolontluchting','Ubbink Ventub 160 – ventilatie','Ontluchtingspan','Ventilatiepan universeel','WTW dakdoorvoer 160','Warmtepomp inlaat','Warmtepomp uitblaas','Anders'];
const PAN_TYPES=['Monier/Braas Rubin 11V','OVH','OVK','Andere dakpan','Onbekend / later invullen'];
const $=id=>document.getElementById(id);
let data=[];try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))data=a;}catch(e){alert('Opgeslagen gegevens konden niet worden geladen.');}
const localDate=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const now=()=>localDate(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('day').value=now();$('listDay').value=now();
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(e){alert('Opslaan mislukt. Controleer de browseropslag.');return false;}}
function tab(t){for(const x of ['plan','edit','list'])$(x).classList.toggle('hidden',x!==t);$('tabPlan').classList.toggle('active',t==='plan');$('tabNew').classList.toggle('active',t==='edit');$('tabList').classList.toggle('active',t==='list');if(t==='plan')render();if(t==='list'){$('listDay').value=$('day').value;renderList();}window.scrollTo(0,0);}
function newJob(){$('form').reset();$('jobId').value='';$('date').value=$('day').value||now();$('formTitle').textContent='Nieuwe opdracht';$('lines').replaceChildren();addLine();tab('edit');}
function addLine(type='',qty=1,panType='',matchPan=''){
const el=document.createElement('div');el.className='item';const known=TYPES.includes(type),selected=known?type:(type?'Anders':TYPES[0]);const panKnown=PAN_TYPES.includes(panType)?panType:(panType?'Andere dakpan':'Onbekend / later invullen');
el.innerHTML=`<div class="row"><select class="grow type" aria-label="Doorvoertype">${TYPES.map(t=>`<option value="${esc(t)}" ${t===selected?'selected':''}>${esc(t)}</option>`).join('')}</select><input class="qty" aria-label="Aantal" type="number" min="1" max="999" step="1" value="${Number(qty)||1}"><button type="button" class="remove" aria-label="Verwijder regel">×</button></div><input class="customType hidden" style="margin-top:8px" aria-label="Omschrijving andere doorvoer" placeholder="Welke doorvoer?" value="${esc(known?'':type)}"><label>Dakpantype</label><select class="panType">${PAN_TYPES.map(t=>`<option value="${esc(t)}" ${t===panKnown?'selected':''}>${esc(t)}</option>`).join('')}</select><input class="panCustom hidden" style="margin-top:8px" placeholder="Merk en type dakpan" aria-label="Ander dakpantype" value="${esc(PAN_TYPES.includes(panType)?'':panType)}"><label>Bijpassende doorvoerpan</label><input class="matchPan" placeholder="Bijvoorbeeld Rubin 11V doorvoerpan antraciet" aria-label="Bijpassende doorvoerpan" value="${esc(matchPan)}"><small class="muted matchHelp"></small>`;
$('lines').append(el);const typeEl=el.querySelector('.type'),custom=el.querySelector('.customType'),panEl=el.querySelector('.panType'),panCustom=el.querySelector('.panCustom'),match=el.querySelector('.matchPan');
function toggleType(){const other=typeEl.value==='Anders';custom.classList.toggle('hidden',!other);custom.required=other;}
function suggest(force=false){const other=panEl.value==='Andere dakpan';panCustom.classList.toggle('hidden',!other);panCustom.required=other;const suggested=panEl.value==='Monier/Braas Rubin 11V'?'Monier/Braas Rubin 11V doorvoerpan (controleer diameter en uitvoering)':'';if(force||!match.value.trim()||match.dataset.suggested==='yes'){match.value=suggested;match.dataset.suggested='yes';}el.querySelector('.matchHelp').textContent=suggested?'Controleer altijd of deze pan bij de gekozen doorvoer past.':'Geen betrouwbare automatische match. Vul zelf de juiste doorvoerpan in.';}
typeEl.addEventListener('change',toggleType);panEl.addEventListener('change',()=>suggest(true));match.addEventListener('input',()=>match.dataset.suggested='no');el.querySelector('.remove').addEventListener('click',()=>el.remove());toggleType();suggest();if(matchPan){match.value=matchPan;match.dataset.suggested='no';}
}
function editJob(id){const j=data.find(x=>x.id===id);if(!j)return;newJob();$('jobId').value=j.id;$('formTitle').textContent='Opdracht aanpassen';for(const k of ['name','address','phone','date','time','notes'])$(k).value=j[k]||'';$('lines').replaceChildren();for(const l of (j.lines||[]))addLine(l.type,l.qty,l.panType||'',l.matchPan||'');if(!j.lines?.length)addLine();}
function removeJob(id){if(confirm('Deze opdracht definitief verwijderen?')){data=data.filter(j=>j.id!==id);save();render();}}
function render(){const arr=data.filter(j=>j.date===$('day').value).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('jobs').innerHTML=arr.length?arr.map(j=>`<div class="panel"><div class="row"><strong class="grow">${esc(j.name)}</strong><span class="pill">${esc(j.time||'Tijd onbekend')}</span></div><div class="muted">📍 ${esc(j.address)}</div>${j.phone?`<div class="muted">☎ ${esc(j.phone)}</div>`:''}<p>${(j.lines||[]).map(l=>`${Number(l.qty)||1}× ${esc(l.type)}<br><span class="muted">Dakpan: ${esc(l.panType||'Niet ingevuld')} · Doorvoerpan: ${esc(l.matchPan||'Nog te bepalen')}</span>`).join('<br>')}</p>${j.notes?`<p class="muted">${esc(j.notes)}</p>`:''}<div class="actions"><button data-action="edit" data-id="${esc(j.id)}">Bewerken</button><button data-action="navigate" data-id="${esc(j.id)}">Navigeren</button>${j.phone?`<button data-action="call" data-id="${esc(j.id)}">Bellen</button>`:''}<button class="danger" data-action="remove" data-id="${esc(j.id)}">Verwijderen</button></div></div>`).join(''):'<div class="panel muted">Geen opdrachten op deze datum. Tik op + Opdracht om er een toe te voegen.</div>';$('notice').textContent=`${arr.length} opdracht(en) op ${$('day').value}. ${data.length} totaal opgeslagen.`;}
function materialRows(d){const sums=new Map();data.filter(j=>j.date===d).forEach(j=>(j.lines||[]).forEach(l=>{const key=JSON.stringify([l.type,l.matchPan||'',l.panType||'']);const entry=sums.get(key)||{type:l.type,pan:l.matchPan||'',roof:l.panType||'',qty:0};entry.qty+=Number(l.qty)||0;sums.set(key,entry);}));return [...sums.values()];}
function listText(){const d=$('listDay').value,rows=materialRows(d),jobs=data.filter(j=>j.date===d);const lines=[`Materiaallijst ${d}`,`${jobs.length} opdracht(en)`,''];for(const l of rows){lines.push(`${l.qty}× ${l.type}`);lines.push(`   ↳ ${l.qty}× ${l.pan||'Doorvoerpan nog bepalen'} (dakpan: ${l.roof||'onbekend'})`);}if(!rows.length)lines.push('Geen materialen gepland');return lines.join('\n');}
function renderList(){const d=$('listDay').value,rows=materialRows(d),jobs=data.filter(j=>j.date===d);$('materials').innerHTML=(rows.map(l=>`<div class="item"><div class="row"><input type="checkbox" class="check"><span class="grow">${esc(l.type)}</span><strong>${l.qty} st.</strong></div><div class="row" style="margin-top:8px"><input type="checkbox" class="check"><span class="grow">↳ ${esc(l.pan||'Doorvoerpan nog bepalen')}<br><small class="muted">Dakpan: ${esc(l.roof||'onbekend')}</small></span><strong>${l.qty} st.</strong></div></div>`).join('')||'<p class="muted">Geen materialen voor deze datum.</p>')+`<p class="total">Totaal: ${rows.reduce((a,l)=>a+l.qty,0)} doorvoeren + bijbehorende doorvoerpannen</p><p class="muted">Gebaseerd op ${jobs.length} opdracht(en). Controleer de pasvorm van de doorvoerpan vóór bestellen.</p>`;}
$('form').addEventListener('submit',e=>{e.preventDefault();const lines=[...$('lines').querySelectorAll('.item')].map(x=>({type:x.querySelector('.type').value==='Anders'?x.querySelector('.customType').value.trim():x.querySelector('.type').value,qty:Number(x.querySelector('.qty').value),panType:x.querySelector('.panType').value==='Andere dakpan'?x.querySelector('.panCustom').value.trim():x.querySelector('.panType').value,matchPan:x.querySelector('.matchPan').value.trim()}));if(!lines.length||lines.some(x=>!x.type||!x.panType||!Number.isInteger(x.qty)||x.qty<1)){alert('Vul bij iedere doorvoer het type, dakpantype en een geldig aantal in.');return;}const id=$('jobId').value||String(Date.now())+'_'+Math.random().toString(36).slice(2);const job={id,name:$('name').value.trim(),address:$('address').value.trim(),phone:$('phone').value.trim(),date:$('date').value,time:$('time').value,notes:$('notes').value.trim(),lines};if(!job.name||!job.address||!job.date)return;const old=data.slice(),i=data.findIndex(x=>x.id===id);if(i<0)data.push(job);else data[i]=job;if(save()){$('day').value=job.date;tab('plan');}else data=old;});
$('jobs').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const j=data.find(x=>x.id===b.dataset.id);if(!j)return;switch(b.dataset.action){case 'edit':editJob(j.id);break;case 'remove':removeJob(j.id);break;case 'navigate':location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(j.address);break;case 'call':location.href='tel:'+j.phone.replace(/[^\d+]/g,'');break;}});
$('tabPlan').addEventListener('click',()=>tab('plan'));$('tabNew').addEventListener('click',newJob);$('tabList').addEventListener('click',()=>tab('list'));$('cancel').addEventListener('click',()=>tab('plan'));$('addLine').addEventListener('click',()=>addLine());$('day').addEventListener('change',render);$('listDay').addEventListener('change',renderList);$('today').addEventListener('click',()=>{$('day').value=now();render();});for(const [id,n] of [['prev',-1],['next',1]])$(id).addEventListener('click',()=>{const d=new Date(($('day').value||now())+'T12:00:00');d.setDate(d.getDate()+n);$('day').value=localDate(d);render();});
$('copy').addEventListener('click',async()=>{const s=listText();try{await navigator.clipboard.writeText(s);alert('Materiaallijst gekopieerd.');}catch(e){prompt('Kopieer de lijst:',s);}});
$('print').addEventListener('click',()=>{const w=window.open('','_blank');if(!w){alert('Pop-up geblokkeerd. Gebruik Kopieer lijst.');return;}w.document.write('<meta charset="utf-8"><title>Materiaallijst</title><pre style="font:18px system-ui;white-space:pre-wrap">'+esc(listText())+'</pre>');w.document.close();w.focus();w.print();});
$('backup').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),jobs:data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dakdoorvoer-backup-'+now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
$('import').addEventListener('click',()=>$('restore').click());$('restore').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const v=JSON.parse(await file.text());if(!Array.isArray(v.jobs)||!v.jobs.every(j=>typeof j.id==='string'&&typeof j.name==='string'&&typeof j.address==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(j.date)&&Array.isArray(j.lines)&&j.lines.every(l=>typeof l.type==='string'&&Number.isInteger(l.qty)&&l.qty>0)))throw Error('Ongeldig bestand');if(!confirm('Dit vervangt alle huidige opdrachten door '+v.jobs.length+' opdrachten uit de back-up. Doorgaan?'))return;const old=data;data=v.jobs;if(save()){render();alert('Back-up hersteld.');}else data=old;}catch(err){alert('Importeren mislukt: '+err.message);}finally{e.target.value='';}});
render();
</script></body></html>
