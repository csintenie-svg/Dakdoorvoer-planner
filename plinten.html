<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c56"><title>Plintenmeter</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#17354b;font-family:system-ui,-apple-system,sans-serif}header{background:#123c56;color:white;padding:18px 16px}header a{color:#fff;text-decoration:none;font-weight:700}h1{font-size:24px;margin:12px 0 0}main{max-width:700px;margin:auto;padding:15px 14px 80px}.panel{background:white;border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 1px 5px #0001}label{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}input,select{width:100%;padding:13px;border:1px solid #cad6df;border-radius:10px;font-size:18px;background:#fff}input[type=number]{font-variant-numeric:tabular-nums}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}button{border:0;border-radius:10px;padding:13px 16px;font-weight:750;font-size:15px;background:#dce6ed;color:#123c56;cursor:pointer}.primary{background:#1675aa;color:white}.danger{color:#a11;background:#ffebeb}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.item{border-bottom:1px solid #e6edf2;padding:13px 0}.item:last-child{border:0}.muted{font-size:13px;color:#667788}.codes{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.codes button{padding:9px 12px}.codes button.selected{background:#123c56;color:white}.empty{color:#667788}.num{font-weight:800}#count{font-size:14px;color:#607486}</style></head><body><header><a href="index.html">‹ Startpagina</a><h1>📏 Plintenmeter</h1><div style="opacity:.8">Kozijnmaten voor het zagen</div></header><main><section class="panel"><label for="project">Project / adres</label><input id="project" placeholder="Bijv. woning of verdieping"><label for="code">Code / positie</label><input id="code" placeholder="Bijv. LO" autocomplete="off"><div class="codes"><button type="button" onclick="setCode('LO')">LO</button><button type="button" onclick="setCode('RO')">RO</button><button type="button" onclick="setCode('LB')">LB</button><button type="button" onclick="setCode('RB')">RB</button><button type="button" onclick="setCode('BO')">BO</button><button type="button" onclick="setCode('ON')">ON</button></div><div class="row"><div><label for="length">Lengte (mm)</label><input id="length" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0"></div><div><label for="width">Breedte (mm)</label><input id="width" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0"></div></div><label for="note">Opmerking (optioneel)</label><input id="note" placeholder="Bijv. verstek links"><div class="actions"><button class="primary" onclick="add()">+ Maat opslaan</button><button onclick="clearForm()">Velden wissen</button></div></section><section class="panel"><h2>Opgeslagen maten</h2><div id="count"></div><div id="items"></div><div class="actions"><button onclick="copyAll()">Kopieer lijst</button><button onclick="exportData()">Exporteer back-up</button><button onclick="document.getElementById('import').click()">Importeer back-up</button><input hidden type="file" id="import" accept=".json,application/json" onchange="importData(event)"><button class="danger" onclick="removeAll()">Alles wissen</button></div><p class="muted">Maten worden op dit apparaat in deze browser opgeslagen. Maak regelmatig een back-up.</p></section></main><script>
const KEY='plintenmeter_v1';const $=id=>document.getElementById(id);let entries=[];try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(d))entries=d}catch(e){alert('Opgeslagen maten konden niet worden geladen.')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch(e){alert('Opslaan mislukt');return false}}function setCode(s){$('code').value=s;document.querySelectorAll('.codes button').forEach(b=>b.classList.toggle('selected',b.textContent===s))}function clearForm(){['code','length','width','note'].forEach(id=>$(id).value='');document.querySelectorAll('.codes button').forEach(b=>b.classList.remove('selected'));$('code').focus()}function add(){let project=$('project').value.trim(),code=$('code').value.trim().toUpperCase(),length=$('length').value,width=$('width').value,note=$('note').value.trim();if(!code||length===''||width===''||!Number.isFinite(Number(length))||!Number.isFinite(Number(width))||Number(length)<=0||Number(width)<=0){alert('Vul een code en een geldige lengte én breedte in.');return}entries.push({id:String(Date.now())+'_'+Math.random().toString(36).slice(2),project,code,length:Number(length),width:Number(width),note});if(save()){render();clearForm()}}function remove(id){if(confirm('Deze maat verwijderen?')){entries=entries.filter(x=>x.id!==id);save();render()}}function removeAll(){if(entries.length&&confirm('Alle plintmaten definitief wissen? Maak eerst een back-up.')){entries=[];save();render()}}function render(){$('count').textContent=entries.length+' maat/maten opgeslagen';$('items').innerHTML=entries.length?entries.map(x=>`<div class="item"><div><strong>${esc(x.code)}</strong> ${x.project?`<span class="muted">· ${esc(x.project)}</span>`:''}</div><div class="num">Lengte: ${esc(x.length)} mm · Breedte: ${esc(x.width)} mm</div>${x.note?`<div class="muted">${esc(x.note)}</div>`:''}<div class="actions"><button class="danger" data-remove="${esc(x.id)}">Verwijderen</button></div></div>`).join(''):'<p class="empty">Nog geen maten opgeslagen.</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>remove(b.dataset.remove)))}function textList(){return 'Plintenmeter\n\n'+entries.map(x=>[x.project,x.code,'Lengte '+x.length+' mm','Breedte '+x.width+' mm',x.note].filter(Boolean).join(' | ')).join('\n')}async function copyAll(){try{await navigator.clipboard.writeText(textList());alert('Lijst gekopieerd')}catch(e){prompt('Kopieer de lijst:',textList())}}function exportData(){let blob=new Blob([JSON.stringify({version:1,entries},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plinten-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.entries)||!d.entries.every(x=>typeof x.id==='string'&&typeof x.code==='string'&&Number.isFinite(x.length)&&Number.isFinite(x.width)))throw Error('Ongeldig back-upbestand');if(confirm('Bestaande plintmaten vervangen door de back-up?')){entries=d.entries;save();render()}}catch(err){alert('Importeren mislukt: '+err.message)}finally{e.target.value=''}}render();
</script></body></html>
